plugins { id 'com.android.application' }

// Jev key is compiled in (personal sideload build) but never committed: read from local.properties
// (jev.key=...) or the road-scout-mcp .env where it already lives.
def jevKey = {
    def lp = rootProject.file('local.properties')
    if (lp.exists()) {
        def p = new Properties(); lp.withInputStream { p.load(it) }
        if (p.getProperty('jev.key')) return p.getProperty('jev.key').trim()
    }
    def env = new File(System.getProperty('user.home'), 'workspace/sandbox/road-scout-mcp/.env')
    if (env.exists()) {
        def line = env.readLines().find { it.startsWith('TYPESAFE_API_KEY=') }
        if (line) return line.substring('TYPESAFE_API_KEY='.length()).trim().replaceAll(/^["']|["']$/, '')
    }
    return ''
}()

android {
    namespace 'app.shubian'
    compileSdk 36
    defaultConfig {
        applicationId 'app.shubian'
        minSdk 33
        targetSdk 36
        versionCode 2
        versionName '1.1'
        ndk { abiFilters 'arm64-v8a' }
        buildConfigField 'String', 'JEV_KEY', '"' + jevKey + '"'
    }
    signingConfigs {
        release {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    androidResources { noCompress 'db' }
    buildFeatures { buildConfig true }
    lint { disable 'SetJavaScriptEnabled', 'JavascriptInterface' }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
