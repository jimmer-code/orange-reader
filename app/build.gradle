plugins { id 'com.android.application' }

// API keys are compiled in for this personal sideload build but never committed:
// opencode.key (OpenCode Go account) for translation, openrouter.key for Jev via OpenRouter.
// kb.base / kb.token are the 课程 content pack base URL (with its private path) and the optional
// X-KB-Token header; see docs/notion-kb-contract.md. All of them stay out of Git.
def lpProps = {
    def lp = rootProject.file('local.properties')
    if (!lp.exists()) return new Properties()
    def p = new Properties(); lp.withInputStream { p.load(it) }
    return p
}()
def opencodeKey = (lpProps.getProperty('opencode.key') ?: '').trim()
def openrouterKey = (lpProps.getProperty('openrouter.key') ?: '').trim()
def kbBase = (lpProps.getProperty('kb.base') ?: '').trim()
def kbToken = (lpProps.getProperty('kb.token') ?: '').trim()

android {
    namespace 'app.shubian'
    compileSdk 36
    defaultConfig {
        applicationId 'app.shubian'
        minSdk 33
        targetSdk 36
        versionCode 25
        versionName '1.24'
        ndk { abiFilters 'arm64-v8a' }
        buildConfigField 'String', 'OPENCODE_KEY', '"' + opencodeKey + '"'
        buildConfigField 'String', 'OPENROUTER_KEY', '"' + openrouterKey + '"'
        buildConfigField 'String', 'KB_BASE', '"' + kbBase + '"'
        buildConfigField 'String', 'KB_TOKEN', '"' + kbToken + '"'
    }
    signingConfigs {
        release {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    androidResources { noCompress 'db' }
    buildFeatures { buildConfig true }
    lint { disable 'SetJavaScriptEnabled', 'JavascriptInterface' }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
