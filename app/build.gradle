plugins { id 'com.android.application' }

android { namespace 'app.shubian'; compileSdk 36
    defaultConfig { applicationId 'app.shubian'; minSdk 33; targetSdk 36; versionCode 1; versionName '1.0' }
    signingConfigs { release { storeFile file(System.getProperty("user.home") + "/.android/debug.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    buildFeatures { buildConfig false }
}
